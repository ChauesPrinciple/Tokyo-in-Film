<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Ramen map browser checks</title>
<pre id="results">RUNNING</pre>
<iframe id="page" src="../ramen-map.html" style="width:1200px;height:1000px;border:0" title="Map under test"></iframe>
<script>
(async () => {
  const output = document.getElementById('results');
  const frame = document.getElementById('page');
  const results = [];
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  function check(condition, message) {
    if (!condition) throw new Error(message);
    results.push('PASS ' + message);
  }
  try {
    for (let i = 0; i < 200; i++) {
      if (frame.contentDocument?.documentElement.dataset.mapReady) break;
      await wait(50);
    }
    const doc = frame.contentDocument;
    const win = frame.contentWindow;
    const $ = id => doc.getElementById(id);
    check(doc.documentElement.dataset.mapReady === 'true', 'Map data loaded');
    const count = doc.querySelectorAll('.shop-card').length;
    check(count >= 8, 'At least eight distinct active places');
    check(doc.querySelectorAll('#ramen-markers .map-marker').length === count, 'Every active place initially on main map');
    check(doc.querySelectorAll('#ueno-map .map-marker').length === 2, 'Both Ueno places in detail inset');
    check(doc.querySelectorAll('.ward-shape').length === 23, 'Shared 23 ward boundaries rendered');
    const discs = [...doc.querySelectorAll('#ramen-markers .marker-disc')];
    check(discs.every((a, i) => discs.slice(i + 1).every(b => Math.hypot(+a.getAttribute('cx') - +b.getAttribute('cx'), +a.getAttribute('cy') - +b.getAttribute('cy')) >= 26)), 'Number discs do not overlap');
    $('shop-nagi').querySelector('button').click();
    check($('shop-nagi').classList.contains('is-selected'), 'List selects the corresponding marker');
    check(doc.querySelector('#ramen-markers [data-shop="nagi"]').getAttribute('aria-pressed') === 'true', 'Selected marker has accessible state');
    const oldTransform = $('ramen-map').firstElementChild.getAttribute('transform');
    $('zoom-in').click();
    check($('ramen-map').firstElementChild.getAttribute('transform') !== oldTransform, 'Zoom changes camera');
    $('fit-map').click();
    check(doc.querySelectorAll('#ramen-markers .map-marker').length === count, 'Fit restores all pins');
    const shima = doc.querySelector('#ramen-markers [data-shop="shima"]');
    shima.focus();
    shima.dispatchEvent(new win.KeyboardEvent('keydown', {key:'Enter', bubbles:true}));
    check($('shop-shima').classList.contains('is-selected'), 'Keyboard activates marker');
    check(doc.activeElement.dataset.shop === 'shima', 'Marker keeps focus after redraw');
    $('shop-search').value = 'muginae';
    $('shop-search').dispatchEvent(new win.Event('input'));
    check(doc.querySelectorAll('.shop-card:not([hidden])').length === 1, 'Search filters index');
    check(doc.querySelectorAll('#ramen-markers .map-marker').length === 1, 'Search filters pins');
    const muginaeNumber = doc.querySelector('#ramen-markers .marker-number').textContent;
    win.dispatchEvent(new win.Event('beforeprint'));
    check(doc.querySelectorAll('.shop-card:not([hidden])').length === count, 'Print includes all places despite filter');
    win.dispatchEvent(new win.Event('afterprint'));
    check($('shop-search').value === 'muginae', 'Print restores search');
    check(doc.querySelectorAll('.shop-card:not([hidden])').length === 1, 'Print restores filtered list');
    check(doc.querySelector('#ramen-markers .marker-number').textContent === muginaeNumber, 'Numbers remain stable');
    $('shop-search').value = 'no such restaurant';
    $('shop-search').dispatchEvent(new win.Event('input'));
    check(!$('empty-state').hidden && !doc.querySelector('#ramen-markers .map-marker'), 'Empty search has no stray pins');
    $('shop-search').value = '';
    $('area-filter').value = 'Ueno / Okachimachi';
    $('area-filter').dispatchEvent(new win.Event('change'));
    check(doc.querySelectorAll('.shop-card:not([hidden])').length === 2, 'Area filter shows both Ueno shops');
    $('area-filter').value = '';
    $('area-filter').dispatchEvent(new win.Event('change'));
    frame.style.width = '390px';
    await wait(200);
    $('fit-map').click();
    check(doc.documentElement.scrollWidth <= 390, 'Mobile has no horizontal overflow');
    check(doc.querySelectorAll('#ramen-markers .map-marker').length === count, 'All pins fit mobile view');
    const mobileDiscs = [...doc.querySelectorAll('#ramen-markers .marker-disc')];
    check(mobileDiscs.every((a, i) => mobileDiscs.slice(i + 1).every(b => Math.hypot(+a.getAttribute('cx') - +b.getAttribute('cx'), +a.getAttribute('cy') - +b.getAttribute('cy')) >= 26)), 'Mobile marker numbers do not overlap');
    for (let i = 0; i < 100 && !doc.getElementById('ramen-transit'); i++) await wait(50);
    check(!!doc.querySelector('#ramen-transit path'), 'Cached subway context rendered');
    $('show-transit').click();
    check($('ramen-transit').style.display === 'none', 'Subway layer can be hidden');
    output.textContent = results.join('\n') + '\nALL PASSED';
    document.documentElement.dataset.result = 'passed';
  } catch (error) {
    output.textContent = results.join('\n') + '\nFAIL ' + error.stack;
    document.documentElement.dataset.result = 'failed';
  }
})();
</script>
</html>
