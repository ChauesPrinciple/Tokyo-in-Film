<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Bowl wall checks</title>
<pre id="results">RUNNING</pre>
<iframe id="page" src="../ramen-map.html" style="width:1200px;height:1000px;border:0" title="Map under test"></iframe>
<script>
(async () => {
  const output = document.getElementById('results');
  const frame = document.getElementById('page');
  const results = [];
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  function check(condition, message) {
    if (!condition) throw new Error(message);
    results.push('PASS ' + message);
  }
  try {
    for (let i = 0; i < 200; i++) {
      if (frame.contentDocument?.documentElement.dataset.mapReady) break;
      await wait(50);
    }
    const doc = frame.contentDocument;
    const win = frame.contentWindow;
    const wall = doc.getElementById('bowl-wall');
    const bowls = [...wall.querySelectorAll('.bowl')];
    check(doc.documentElement.dataset.mapReady === 'true', 'Map data loaded');
    check(bowls.length === 12, 'Wall lists exactly twelve bowls');
    check(bowls.map(b => b.textContent.trim()).join(',') === '01,02,03,04,05,06,07,08,09,10,11,12', 'Numbers run 01 to 12 with no 13');

    // Desktop: one quiet row
    const tops = bowls.map(b => b.getBoundingClientRect().top);
    check(Math.max(...tops) - Math.min(...tops) < 1, 'Desktop: all twelve on a single row');
    const height = bowls[0].getBoundingClientRect().height;
    check(height >= 24 && height <= 40, 'Desktop: buttons stay small (' + height.toFixed(1) + 'px tall)');
    const numStyle = win.getComputedStyle(bowls[0].querySelector('.bowl-num'));
    check(numStyle.fontSize === '12.5px', 'Numbers set small (' + numStyle.fontSize + ')');
    check(!numStyle.fontFamily.includes('Mincho'), 'Numbers use the page sans-serif, not the mincho display face');
    check(!/207,\s*33,\s*24/.test(numStyle.color), 'Numbers are muted (' + numStyle.color + '), not oni red');
    const strip = doc.querySelector('.challenge-strip');
    check(wall.getBoundingClientRect().top >= strip.getBoundingClientRect().bottom - 2, 'Row sits below the two challenge descriptions');
    const countSize = win.getComputedStyle(doc.querySelector('.challenge-count')).fontSize;
    check(parseFloat(numStyle.fontSize) < parseFloat(countSize), 'Numbers are smaller than the challenge heading numerals (' + numStyle.fontSize + ' vs ' + countSize + ')');

    // Interaction still jumps to the shop
    bowls[2].click();
    await wait(100);
    check(bowls[2].classList.contains('is-selected'), 'Clicking a number selects it');
    check(bowls[2].getAttribute('aria-pressed') === 'true', 'Selected number carries aria-pressed');
    const card = doc.querySelector('.shop-card.is-selected');
    check(card && card.id === 'shop-' + bowls[2].dataset.shop, 'Clicking jumps the list to that shop');
    const marker = doc.querySelector('.map-marker[data-shop="' + bowls[2].dataset.shop + '"]');
    check(marker && marker.classList.contains('is-selected'), 'Clicking selects that shop on the map');

    // Phone: two rows of six
    frame.style.width = '390px';
    await wait(400);
    const tops2 = bowls.map(b => Math.round(b.getBoundingClientRect().top));
    const rows = [...new Set(tops2)];
    check(rows.length === 2, 'Phone: numbers break into two rows (got ' + rows.length + ')');
    check(rows.every(t => tops2.filter(x => x === t).length === 6), 'Phone: six numbers per row');
    const wallRect = wall.getBoundingClientRect();
    check(wallRect.left >= 0 && wallRect.right <= 391, 'Phone: row fits the width with no sideways scroll');

    output.textContent = results.join('\n') + '\nALL PASSED';
    document.documentElement.dataset.result = 'passed';
  } catch (error) {
    output.textContent = results.join('\n') + '\nFAIL ' + error.stack;
    document.documentElement.dataset.result = 'failed';
  }
})();
</script>
</html>
